_schema-version: "3.1"
ID: Z_BID_MATRIX
version: 1.0.0

modules:

  - name: Z_BID_MATRIX-srv
    type: nodejs
    path: gen/srv
    parameters:
      memory: 256M
    provides:
      - name: srv-api
        properties:
          url: ${default-url}
    build-parameters:
      builder: npm-ci

  - name: zbidmatrixapp
    type: html5
    path: app/zbidmatrixapp
    parameters:
      memory: 128M
    build-parameters:
      builder: custom
      commands:
        - npm install
        - npm run build
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{url}
          forwardAuthToken: false

resources: []

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production